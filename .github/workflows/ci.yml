name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: check is pure `node --check`, and this unit subset
      # uses only node builtins plus first-party files. scripts/rl/tests
      # needs playwright browsers, so it stays local-only via `npm test`.
      - name: npm run check
        run: npm run check

      - name: unit tests (install-free subset)
        run: node --test tests/*.test.cjs tests/*.test.mjs scripts/validation-loop/tests/*.test.mjs

  rl-python:
    name: RL Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-rl-${{ hashFiles('rl/requirements.txt') }}

      # CPU-only torch for this pin (same version as requirements.txt);
      # numpy falls through to PyPI.
      - name: Install RL requirements
        run: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r rl/requirements.txt

      - name: RL core tests
        run: python -m unittest discover -s rl/tests -p "test_*.py"

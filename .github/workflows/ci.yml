name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install required: check is pure `node --check` on first-party JS.
      - name: npm run check
        run: npm run check

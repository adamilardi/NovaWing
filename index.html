<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#04060f">
    <meta name="format-detection" content="telephone=no">
    <!-- Kindle Fire / Android: prefer landscape when the browser honors it -->
    <meta name="screen-orientation" content="landscape">
    <title>NovaWing</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js" integrity="sha384-aXdd1+FsRjZEhCvCHkb9vIHn1M7MyMT0d3L4WlQ2sx7qaJb/cNRydZCUKbWkS0io" crossorigin="anonymous"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #111b30 0%, #050812 65%, #020309 100%);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            box-sizing: border-box;
        }
        #game-container {
            width: 100%;
            height: 100%;
            min-height: 100%;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        /* Native-size touch dock. Portrait keeps controls in the generous space
           below the FIT canvas; landscape pins them to unobtrusive side rails. */
        #touch-dock {
            display: none;
            position: fixed;
            z-index: 20;
            inset: auto env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
            height: 142px;
            pointer-events: none;
            font-family: monospace;
            -webkit-user-select: none;
            user-select: none;
        }
        #touch-dock.is-active { display: block; }
        #touch-launch {
            display: none;
            position: fixed;
            z-index: 21;
            left: 50%;
            bottom: calc(154px + env(safe-area-inset-bottom, 0px));
            width: min(260px, 72vw);
            height: 54px;
            transform: translateX(-50%);
            border: 2px solid #66f6ff;
            border-radius: 12px;
            background: #12445cee;
            color: #fff;
            font: 700 18px monospace;
            letter-spacing: 2px;
            box-shadow: 0 0 22px #66f6ff55;
        }
        #touch-launch.is-active { display: block; }
        .touch-stick, .touch-action, .touch-auto, .touch-utility {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-stick {
            left: max(16px, env(safe-area-inset-left));
            bottom: 12px;
            width: 104px;
            height: 104px;
            border: 2px solid #66f6ff;
            border-radius: 50%;
            background: #08101899;
            box-shadow: 0 0 18px #66f6ff44;
        }
        .touch-stick-knob {
            position: absolute;
            left: 50%; top: 50%;
            width: 42px; height: 42px;
            margin: -21px;
            border: 2px solid #e8f0ff;
            border-radius: 50%;
            background: #66f6ff99;
            pointer-events: none;
            transform: translate(0, 0);
        }
        .touch-action {
            right: max(18px, env(safe-area-inset-right));
            bottom: 14px;
            width: 94px; height: 94px;
            border: 2px solid #ffb080;
            border-radius: 50%;
            background: #ff664477;
            color: #fff; font: 700 16px monospace;
            text-shadow: 0 2px #050816;
        }
        .touch-action.is-active { background: #ff8a66dd; box-shadow: 0 0 20px #ff8866aa; }
        .touch-boost.is-active { background: #66ccffdd; box-shadow: 0 0 20px #66ccffaa; }
        .touch-stick.is-active { background: #0a2335bb; }
        .touch-boost {
            right: max(116px, calc(env(safe-area-inset-right) + 116px));
            bottom: 24px;
            width: 70px; height: 70px;
            border-color: #9cdeff;
            background: #44aaff77;
            font-size: 12px;
        }
        .touch-auto {
            right: max(32px, env(safe-area-inset-right, 0px));
            bottom: 112px;
            min-width: 68px;
            height: 44px;
            border: 1px solid #ffb080;
            border-radius: 14px;
            background: #07101ddd;
            color: #ffcab0;
            font: 11px monospace;
        }
        .touch-utility {
            top: 6px;
            left: 50%;
            display: flex;
            gap: 8px;
            transform: translateX(-50%);
        }
        .touch-utility button {
            min-width: 54px; height: 44px;
            border: 1px solid #8aa0c8;
            border-radius: 6px;
            background: #07101ddd;
            color: #dce8ff;
            font: 11px monospace;
        }
        @media (orientation: portrait) {
            html.touch-device #game-container {
                height: calc(100% - 190px - env(safe-area-inset-bottom, 0px));
                min-height: 0;
                align-items: flex-start;
                padding-top: max(8px, env(safe-area-inset-top));
                box-sizing: border-box;
            }
            #touch-dock { height: 190px; }
            #touch-launch { bottom: calc(200px + env(safe-area-inset-bottom, 0px)); height: 58px; }
            .touch-stick { left: max(20px, env(safe-area-inset-left)); bottom: 22px; width: 104px; height: 104px; }
            .touch-action { right: max(20px, env(safe-area-inset-right)); bottom: 24px; width: 96px; height: 96px; }
            .touch-boost { right: max(28px, env(safe-area-inset-right)); bottom: 126px; width: 68px; height: 68px; }
            .touch-auto { right: max(118px, env(safe-area-inset-right, 0px)); bottom: 130px; }
            .touch-utility { left: 4px; top: 6px; transform: none; }
        }
        #game-container canvas {
            border: 1px solid #30465c;
            box-sizing: border-box;
            box-shadow: 0 0 0 5px #080e19, 0 0 48px #12283c80;
            /* Smooth fractional FIT scaling keeps small UI text legible. */
            image-rendering: auto;
            touch-action: none;
            /* Reset any Phaser inline margins so flex can truly center */
            margin: 0 !important;
            display: block;
            max-width: 100%;
            max-height: 100%;
            /* Avoid blurry upscale on some Android GPUs */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        /* Thin hint bar if JS is slow to boot on Silk */
        #boot-hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 12px;
            text-align: center;
            color: #8aa0c8;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            opacity: 0.85;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="touch-dock" aria-label="Touch controls">
        <div class="touch-stick" data-touch="stick"><div class="touch-stick-knob"></div></div>
        <button class="touch-action touch-boost" type="button" data-touch="boost">BOOST</button>
        <button class="touch-action" type="button" data-touch="fire">FIRE</button>
        <button class="touch-auto" type="button" data-touch="auto">AUTO: ON</button>
        <div class="touch-utility"><button type="button" data-touch="pause">PAUSE</button><button type="button" data-touch="mute">SOUND</button></div>
    </div>
    <button id="touch-launch" type="button">LAUNCH</button>
    <div id="boot-hint">Preparing NovaWing…</div>
    <script src="src/assets.js?v=1.3.3"></script>
    <script src="src/level-flow.js?v=1.3.3"></script>
    <script src="src/audio-director.js?v=1.3.3"></script>
    <script src="levels.js?v=1.3.3"></script>
    <script src="audio.js?v=1.3.3"></script>
    <script src="game.js?v=1.3.3"></script>
    <script>
        // Hide boot hint once the game marks itself ready (or after a few seconds).
        (function () {
            function hide() {
                var el = document.getElementById('boot-hint');
                if (el) el.style.display = 'none';
            }
            var n = 0;
            var id = setInterval(function () {
                n += 1;
                if (window.__novawingDebug && window.__novawingDebug.ready && window.__novawingDebug.ready()) {
                    hide();
                    clearInterval(id);
                } else if (n > 40) {
                    hide();
                    clearInterval(id);
                }
            }, 250);
            // First interaction: unlock audio contexts browsers block until gesture.
            function unlock() {
                try {
                    if (window.__novawingDebug && window.__novawingDebug.ready) {
                        /* game handles sfx unlock on pointer */
                    }
                } catch (e) {}
                document.removeEventListener('touchstart', unlock, true);
                document.removeEventListener('pointerdown', unlock, true);
            }
            document.addEventListener('touchstart', unlock, true);
            document.addEventListener('pointerdown', unlock, true);
        })();
    </script>
</body>
</html>

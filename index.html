<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#04060f">
    <meta name="format-detection" content="telephone=no">
    <!-- Kindle Fire / Android: prefer landscape when the browser honors it -->
    <meta name="screen-orientation" content="landscape">
    <title>NovaWing</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js" integrity="sha384-aXdd1+FsRjZEhCvCHkb9vIHn1M7MyMT0d3L4WlQ2sx7qaJb/cNRydZCUKbWkS0io" crossorigin="anonymous"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            /* Safe areas (notches) — pad container, game still FIT-scales */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }
        #game-container {
            width: 100%;
            height: 100%;
            min-height: 100%;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #game-container canvas {
            border: 2px solid #333;
            image-rendering: pixelated;
            touch-action: none;
            /* Reset any Phaser inline margins so flex can truly center */
            margin: 0 !important;
            display: block;
            max-width: 100%;
            max-height: 100%;
            /* Avoid blurry upscale on some Android GPUs */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        /* Thin hint bar if JS is slow to boot on Silk */
        #boot-hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 12px;
            text-align: center;
            color: #8aa0c8;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            opacity: 0.85;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="boot-hint">Tap screen · Landscape · P pause · SPACE CADET / HOTSHOT / SUPERNOVA in pause · AUTO fire · BOOST</div>
    <script src="src/assets.js?v=1.3.0"></script>
    <script src="src/level-flow.js?v=1.3.0"></script>
    <script src="src/audio-director.js?v=1.3.0"></script>
    <script src="levels.js?v=1.3.0"></script>
    <script src="audio.js?v=1.3.0"></script>
    <script src="game.js?v=1.3.0"></script>
    <script>
        // Hide boot hint once the game marks itself ready (or after a few seconds).
        (function () {
            function hide() {
                var el = document.getElementById('boot-hint');
                if (el) el.style.display = 'none';
            }
            var n = 0;
            var id = setInterval(function () {
                n += 1;
                if (window.__novawingDebug && window.__novawingDebug.ready && window.__novawingDebug.ready()) {
                    hide();
                    clearInterval(id);
                } else if (n > 40) {
                    hide();
                    clearInterval(id);
                }
            }, 250);
            // First interaction: unlock audio contexts browsers block until gesture.
            function unlock() {
                try {
                    if (window.__novawingDebug && window.__novawingDebug.ready) {
                        /* game handles sfx unlock on pointer */
                    }
                } catch (e) {}
                document.removeEventListener('touchstart', unlock, true);
                document.removeEventListener('pointerdown', unlock, true);
            }
            document.addEventListener('touchstart', unlock, true);
            document.addEventListener('pointerdown', unlock, true);
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#04060f">
    <meta name="format-detection" content="telephone=no">
    <!-- Kindle Fire / Android: prefer landscape when the browser honors it -->
    <meta name="screen-orientation" content="landscape">
    <title>NovaWing</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #111b30 0%, #050812 65%, #020309 100%);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            box-sizing: border-box;
        }
        #game-container {
            width: 100%;
            height: 100%;
            min-height: 100%;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        /* Native-size touch dock. Portrait keeps controls in the generous space
           below the FIT canvas; landscape pins them to unobtrusive side rails. */
        #touch-dock {
            display: none;
            position: fixed;
            z-index: 20;
            inset: auto env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
            height: 142px;
            pointer-events: none;
            font-family: monospace;
            -webkit-user-select: none;
            user-select: none;
        }
        #touch-dock.is-active { display: block; }
        .touch-stick, .touch-action, .touch-auto, .touch-utility {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-stick {
            left: max(16px, env(safe-area-inset-left));
            bottom: 12px;
            width: 104px;
            height: 104px;
            border: 2px solid #66f6ff;
            border-radius: 50%;
            background: #08101899;
            box-shadow: 0 0 18px #66f6ff44;
        }
        .touch-stick-knob {
            position: absolute;
            left: 50%; top: 50%;
            width: 42px; height: 42px;
            margin: -21px;
            border: 2px solid #e8f0ff;
            border-radius: 50%;
            background: #66f6ff99;
            pointer-events: none;
            transform: translate(0, 0);
        }
        .touch-action {
            right: max(18px, env(safe-area-inset-right));
            bottom: 14px;
            width: 94px; height: 94px;
            border: 2px solid #ffb080;
            border-radius: 50%;
            background: #ff664477;
            color: #fff; font: 700 16px monospace;
            text-shadow: 0 2px #050816;
        }
        .touch-action.is-active { background: #ff8a66dd; box-shadow: 0 0 20px #ff8866aa; }
        .touch-boost.is-active { background: #66ccffdd; box-shadow: 0 0 20px #66ccffaa; }
        .touch-stick.is-active { background: #0a2335bb; }
        .touch-boost {
            right: max(116px, calc(env(safe-area-inset-right) + 116px));
            bottom: 24px;
            width: 70px; height: 70px;
            border-color: #9cdeff;
            background: #44aaff77;
            font-size: 12px;
        }
        .touch-auto {
            right: max(32px, env(safe-area-inset-right, 0px));
            bottom: 112px;
            min-width: 68px;
            height: 44px;
            border: 1px solid #ffb080;
            border-radius: 14px;
            background: #07101ddd;
            color: #ffcab0;
            font: 11px monospace;
        }
        .touch-utility {
            top: 6px;
            left: 50%;
            display: flex;
            gap: 8px;
            transform: translateX(-50%);
        }
        .touch-utility button {
            min-width: 54px; height: 44px;
            border: 1px solid #8aa0c8;
            border-radius: 6px;
            background: #07101ddd;
            color: #dce8ff;
            font: 11px monospace;
        }
        @media (orientation: portrait) {
            html.touch-device {
                --touch-playfield-height: min(75vw, calc(100dvh - 230px));
                --touch-stack-top: max(env(safe-area-inset-top, 0px), calc((100dvh - var(--touch-playfield-height) - 214px) / 2));
            }
            html.touch-device #game-container {
                position: fixed;
                top: var(--touch-stack-top);
                height: var(--touch-playfield-height);
                min-height: 0;
                align-items: center;
                box-sizing: border-box;
            }
            html.touch-device #touch-dock {
                top: calc(var(--touch-stack-top) + var(--touch-playfield-height) + 12px);
                bottom: auto;
                height: 202px;
            }
            .touch-stick { left: max(20px, env(safe-area-inset-left)); bottom: 22px; width: 104px; height: 104px; }
            .touch-action { right: max(20px, env(safe-area-inset-right)); bottom: 24px; width: 96px; height: 96px; }
            .touch-boost { right: max(28px, env(safe-area-inset-right)); bottom: 126px; width: 68px; height: 68px; }
            .touch-auto { right: max(118px, env(safe-area-inset-right, 0px)); bottom: 130px; }
            .touch-utility { left: 4px; top: 6px; transform: none; }
        }
        @media (orientation: landscape) {
            html.touch-device #game-container {
                width: calc(100% - 264px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
                margin-left: calc(132px + env(safe-area-inset-left, 0px));
            }
            #touch-dock { top: env(safe-area-inset-top, 0px); height: auto; }
            .touch-stick { left: max(8px, env(safe-area-inset-left)); bottom: 12px; }
            .touch-action { right: max(12px, env(safe-area-inset-right)); bottom: 12px; }
            .touch-boost { right: max(24px, env(safe-area-inset-right)); bottom: 118px; }
            .touch-auto { right: max(24px, env(safe-area-inset-right)); bottom: 198px; }
            .touch-utility {
                left: max(12px, env(safe-area-inset-left));
                top: 12px;
                flex-direction: column;
                transform: none;
            }
        }
        #game-container canvas {
            border: 1px solid #30465c;
            box-sizing: border-box;
            box-shadow: 0 0 0 5px #080e19, 0 0 48px #12283c80;
            /* Smooth fractional FIT scaling keeps small UI text legible. */
            image-rendering: auto;
            touch-action: none;
            /* Reset any Phaser inline margins so flex can truly center */
            margin: 0 !important;
            display: block;
            max-width: 100%;
            max-height: 100%;
            /* Avoid blurry upscale on some Android GPUs */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        /* Visible before Phaser and game.js. Those scripts used to sit in
           the head and blocked the first paint, so the page looked blank. */
        #boot-screen {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            box-sizing: border-box;
            background: radial-gradient(ellipse at center, #111b30 0%, #050812 65%, #020309 100%);
            color: #e8f0ff;
            font-family: monospace;
            text-align: center;
            pointer-events: auto;
        }
        #boot-screen.is-done {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }
        .boot-spinner {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 3px solid #1c3c55;
            border-top-color: #66f6ff;
            box-shadow: 0 0 18px #66f6ff55;
            animation: boot-spin 0.9s linear infinite;
        }
        .boot-kicker {
            margin: 4px 0 0;
            color: #8aa0c8;
            font-size: 12px;
            letter-spacing: 0.18em;
        }
        .boot-title {
            margin: 0;
            color: #eafcff;
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-shadow: 0 0 18px #176c9a;
        }
        .boot-track {
            width: min(320px, 72vw);
            height: 8px;
            margin-top: 6px;
            border: 1px solid #30465c;
            border-radius: 99px;
            background: #071018;
            overflow: hidden;
            box-shadow: inset 0 0 8px #000;
        }
        #boot-bar {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, #176c9a, #66f6ff);
            box-shadow: 0 0 12px #66f6ff88;
            animation: boot-indeterminate 1.1s ease-in-out infinite;
        }
        #boot-bar.is-measured {
            animation: none;
            transform: none;
        }
        #boot-hint {
            min-height: 1.4em;
            color: #8aa0c8;
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 0.04em;
        }
        #boot-screen.is-error .boot-spinner,
        #boot-screen.is-error .boot-track { display: none; }
        #boot-hint.is-error {
            max-width: 420px;
            color: #e8f0ff;
            font-size: 16px;
            line-height: 1.5;
        }
        #boot-hint.is-error button {
            display: block;
            margin: 18px auto 0;
            padding: 10px 24px;
            border: 2px solid #66f6ff;
            border-radius: 6px;
            background: #12445c;
            color: #fff;
            font: bold 16px monospace;
            cursor: pointer;
        }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
        @keyframes boot-indeterminate {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .boot-spinner, #boot-bar { animation: none; }
        }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-kicker">THE LAST STARFIGHTER SQUADRON</p>
        <h1 class="boot-title">NOVAWING</h1>
        <div class="boot-track" aria-hidden="true"><div id="boot-bar"></div></div>
        <div id="boot-hint" role="status" aria-live="polite">Preparing NovaWing…</div>
    </div>
    <script>
        // Runs before Phaser so the retry timer covers the CDN download.
        // game.js calls NovaWingBoot while artwork is still loading.
        (function () {
            var hint = document.getElementById('boot-hint');
            var screen = document.getElementById('boot-screen');
            var bar = document.getElementById('boot-bar');
            var announced = -1;
            var failed = false;
            var deadline = Date.now() + 30000;
            var id = 0;
            function gameIsVisible() {
                var debug = window.__novawingDebug;
                if (!debug) return false;
                if (debug.getOpeningState && debug.getOpeningState().hasOverlay) return true;
                if (debug.getBotSnapshot && debug.getBotSnapshot().ready) return true;
                return false;
            }
            function dismiss() {
                if (failed || !screen || screen.dataset.dismissed) return;
                screen.dataset.dismissed = '1';
                screen.classList.add('is-done');
                clearInterval(id);
                setTimeout(function () {
                    if (!failed) screen.style.display = 'none';
                }, 280);
            }
            function fail() {
                if (failed || !hint) return;
                failed = true;
                clearInterval(id);
                if (screen) {
                    screen.dataset.dismissed = '';
                    screen.classList.remove('is-done');
                    screen.classList.add('is-error');
                    screen.style.display = 'flex';
                }
                hint.classList.add('is-error');
                hint.setAttribute('role', 'alert');
                hint.textContent = 'NovaWing could not load. Check your connection and try again.';
                var retry = document.createElement('button');
                retry.type = 'button';
                retry.textContent = 'RETRY';
                retry.addEventListener('click', function () { window.location.reload(); });
                hint.appendChild(retry);
            }
            window.NovaWingBoot = {
                setProgress: function (fraction) {
                    if (failed || !bar) return;
                    var pct = Math.max(0, Math.min(100, Math.round(Number(fraction) * 100)));
                    if (!Number.isFinite(pct)) return;
                    deadline = Date.now() + 30000;
                    bar.classList.add('is-measured');
                    bar.style.width = pct + '%';
                    if (hint && pct !== announced && (pct === 100 || pct >= announced + 5)) {
                        announced = pct;
                        hint.textContent = pct >= 100 ? 'Starting…' : 'Loading ' + pct + '%';
                    }
                },
                dismiss: dismiss
            };
            id = setInterval(function () {
                if (gameIsVisible()) {
                    dismiss();
                } else if (window.__novaPhaserLoadFailed || Date.now() > deadline) {
                    fail();
                }
            }, 250);
            function unlock() {
                document.removeEventListener('touchstart', unlock, true);
                document.removeEventListener('pointerdown', unlock, true);
            }
            document.addEventListener('touchstart', unlock, true);
            document.addEventListener('pointerdown', unlock, true);
        })();
    </script>
    <div id="game-container"></div>
    <div id="touch-dock" aria-label="Touch controls">
        <div class="touch-stick" data-touch="stick"><div class="touch-stick-knob"></div></div>
        <button class="touch-action touch-boost" type="button" data-touch="boost">BOOST</button>
        <button class="touch-action" type="button" data-touch="fire">FIRE</button>
        <button class="touch-auto" type="button" data-touch="auto">AUTO: ON</button>
        <div class="touch-utility"><button type="button" data-touch="weapon">GUN</button><button type="button" data-touch="pause">PAUSE</button><button type="button" data-touch="mute">SOUND</button></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js" integrity="sha384-aXdd1+FsRjZEhCvCHkb9vIHn1M7MyMT0d3L4WlQ2sx7qaJb/cNRydZCUKbWkS0io" crossorigin="anonymous"></script>
    <script>
        // Synchronous CDN fallback: if the CDN copy failed (network or SRI),
        // load the vendored copy before any game script runs. This block is
        // parser-inserted, so document.write preserves execution order.
        if (typeof window !== 'undefined' && !window.Phaser) {
            document.write('<script src="vendor/phaser.min.js"><\/script>');
        }
    </script>
    <script>
        // Separate block: runs after the injected fallback above has executed,
        // so the boot screen only shows retry when both copies failed.
        if (typeof window !== 'undefined' && !window.Phaser) {
            window.__novaPhaserLoadFailed = true;
        }
    </script>
    <script src="src/assets.js?v=dev"></script>
    <script src="src/level-flow.js?v=dev"></script>
    <script src="src/gameplay-rng.js?v=dev"></script>
    <script src="src/corridor-math.js?v=dev"></script>
    <script src="src/enemy-math.js?v=dev"></script>
    <script src="src/difficulty-heat.js?v=dev"></script>
    <script src="src/audio-director.js?v=dev"></script>
    <script src="levels.js?v=dev"></script>
    <script src="levels.validation.js?v=dev"></script>
    <script src="audio.js?v=dev"></script>
    <script src="src/pilot-tactics.js?v=dev"></script>
    <script src="src/pilot-facts.js?v=dev"></script>
    <script src="src/boss-director.js?v=dev"></script>
    <script src="game.js?v=dev"></script>
</body>
</html>

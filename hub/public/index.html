<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="description" content="Ailardi Arcade — NovaWing and Space Chicken, ready to play." />
    <title>Ailardi Arcade</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0b0a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='36' fill='%23f6f3ec'%3EA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css?v=5" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">Ailardi</a>
      <p>Arcade · two games</p>
    </header>

    <main class="stage">
      <a class="poster nova" href="https://novawing.ailardi.com/">
        <div class="art">
          <img src="/novawing-card.jpg" alt="" />
        </div>
        <div class="dock">
          <p class="kicker">Shooter</p>
          <h2>NovaWing</h2>
          <p class="blurb">A starfighter run through hostile fleets, with a collapsing star at the end.</p>
          <p class="record" id="novawing-record">Record …</p>
          <span class="play">Play <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6"/></svg></span>
        </div>
      </a>

      <a class="poster chick" href="https://space-chicken.ailardi.com/">
        <div class="art">
          <img src="/space-chicken-card.jpg" alt="" />
        </div>
        <div class="dock">
          <p class="kicker">Platformer</p>
          <h2>Space Chicken</h2>
          <p class="blurb">Jetpack between the platforms. The landings are the hard part.</p>
          <span class="play">Play <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6"/></svg></span>
        </div>
      </a>
    </main>

    <script>
      (function () {
        var record = document.getElementById('novawing-record');
        if (!record) return;
        var version = '1.2.1';
        var api = 'https://novawing.ailardi.com/api/leaderboard';
        function load(scope) {
          return fetch(api + '?version=' + encodeURIComponent(version) + '&scope=' + encodeURIComponent(scope), {
            headers: { Accept: 'application/json' }
          }).then(function (response) {
            if (!response.ok) throw new Error('board');
            return response.json();
          });
        }
        function posterTime(ms) {
          var minutes = Math.floor(ms / 60000);
          var seconds = Math.floor((ms % 60000) / 1000);
          var centiseconds = Math.floor((ms % 1000) / 10);
          function pad(value) { return (value < 10 ? '0' : '') + value; }
          return (pad(minutes) + ':' + pad(seconds) + '.' + pad(centiseconds)).replace(/^0(?=\d:)/, '');
        }
        function show(kind, entry) {
          var name = String(entry.name || '').toUpperCase();
          record.textContent = (kind === 'campaign' ? 'Campaign  ' : 'Record  ') + posterTime(entry.timeMs) + '  ' + name + (entry.continues ? ' · ' + entry.continues + (entry.continues === 1 ? ' continue' : ' continues') : '');
        }
        load('campaign').then(function (campaign) {
          var rows = campaign.entries || [];
          if (rows.length) { show('campaign', rows[0]); return; }
          return load('level-1').then(function (level) {
            var levelRows = level.entries || [];
            if (levelRows.length) show('level', levelRows[0]);
            else record.textContent = 'Hotshot unclaimed';
          });
        }).catch(function () { record.hidden = true; });
      })();
    </script>
  </body>
</html>
